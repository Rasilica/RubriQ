[project]
name = "before-submit"
version = "0.1.0"
description = "RubriQ local document preparation and evidence-based AI review"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.13"
dependencies = [
  "certifi>=2026.1.4",
  "defusedxml>=0.7.1,<0.8",
  "fastapi>=0.121,<1",
  "keyring>=25.6,<26",
  "olefile>=0.47,<0.48",
  "pillow>=11 ; sys_platform == 'win32'",
  "pydantic>=2.12,<3",
  "pypdf>=6.19,<7",
  "pypdfium2>=4.30,<6 ; sys_platform == 'win32'",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "httpx2>=2,<3",
    "pillow>=11",
    "pypdfium2>=4.30,<6",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "reportlab>=4.4,<5",
    "ruff>=0.14,<1",
    "types-defusedxml",
    "types-olefile",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "tools"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
source = ["submission"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "FAST001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "D", "ANN", "INP001"]
"src/submission/{extraction,guard,main}.py" = ["EM101"]

[tool.ruff.lint.pydocstyle]
convention = "google"
