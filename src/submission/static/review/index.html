<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="안내문의 원문을 보며 요구사항을 수정하고 제출 전 확인 기준을 확정합니다.">
  <meta name="color-scheme" content="light dark">
  <title>요구사항 확인 | RubriQ</title>
  <link rel="icon" type="image/svg+xml" href="/brand-assets/rubriq-mark.svg"><link rel="stylesheet" href="/review-assets/tokens.css">
  <link rel="stylesheet" href="/review-assets/components.css">
  <link rel="stylesheet" href="/review-assets/review.css">
  <script type="module" src="/review-assets/app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">요구사항 편집으로 이동</a>
  <div class="app-shell">
    <header class="app-header"><a class="wordmark" href="/review"><img src="/brand-assets/rubriq-mark.svg" width="28" height="28" alt="" class="brand-mark">RubriQ</a><span class="muted">요구사항 확인</span><span class="grow"></span><span class="badge">로컬 데모</span></header>
    <section class="context-bar stack" aria-labelledby="page-title">
      <div class="cluster"><h1 id="page-title">검사 기준을 먼저 확인하세요</h1><span class="badge info">테스트 응답</span></div>
      <p class="muted">안내문 원문과 초안을 비교하고 필요한 내용을 수정한 뒤 기준을 확정하세요.</p>
      <p class="session-note">AI 호출 없이 준비한 예제입니다. 변경사항은 이 세션에서만 유지되며 새로고침하면 새 데모를 시작합니다.</p>
    </section>
    <main id="workspace" class="workspace empty-workspace" tabindex="-1">
      <section class="welcome panel paper stack" id="welcome">
        <span class="badge">안내문 예제</span><h2>원문에서 시작하는 확인</h2>
        <p>합성 안내문의 요구사항을 불러와 필수·선택·조건부 항목을 직접 확인할 수 있습니다.</p>
        <div><button id="start-demo" class="button primary" type="button">데모 시작</button></div>
        <p class="muted">불러온 초안은 아직 확정된 검사 기준이 아닙니다.</p>
      </section>
      <nav id="requirement-nav" class="requirement-nav scroll-pane" aria-label="요구사항 목록" hidden></nav>
      <section id="editor-pane" class="editor-pane scroll-pane" aria-label="요구사항 편집" hidden></section>
      <aside id="source-pane" class="source-pane scroll-pane" aria-label="안내문 원문과 확정 이력" hidden></aside>
    </main>
    <footer id="action-bar" class="action-bar" hidden>
      <div class="grow stack action-status"><strong id="revision-status"></strong><p id="confirmation-help" class="muted"></p></div>
      <div class="cluster"><button id="save-review" class="button" type="button">변경사항 저장</button><button id="confirm-review" class="button primary" type="button">기준 확정</button></div>
    </footer>
    <div id="message-area" class="message-area" aria-live="polite"></div>
  </div>
  <noscript><p class="notice">요구사항 확인 화면을 사용하려면 브라우저의 JavaScript를 켜주세요.</p></noscript>
</body>
</html>
